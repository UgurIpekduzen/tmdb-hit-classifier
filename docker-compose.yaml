name: tmdb-mlflow

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts
      - "mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/').read()"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.10-slim-bookworm

        WORKDIR /app

        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt

        COPY app/ app/
        COPY data/ data/

        ENV PYTHONPATH=/app
        ENV MLFLOW_TRACKING_URI=http://mlflow:5000
        ENV MODEL_STAGE=Production
        ENV DATASET_PATH=data/tmdb_model.csv

        EXPOSE 8000

        CMD ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_STAGE: ${MODEL_STAGE:-Production}
      DATASET_PATH: data/tmdb_model.csv
      PREDICT_THRESHOLD: ${PREDICT_THRESHOLD:-0.5}
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  ui:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.10-slim-bookworm

        WORKDIR /app

        RUN pip install --no-cache-dir streamlit==1.37.1 requests==2.32.5

        COPY app/ui.py app/ui.py

        ENV PYTHONPATH=/app
        ENV API_URL=http://api:8000

        EXPOSE 8501

        CMD ["streamlit", "run", "app/ui.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlflow_data:
